name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Require Linux x86-64
        run: test "$(uname -m)" = "x86_64"

      - name: Configure
        run: >-
          cmake -S . -B build-release
          -DCMAKE_BUILD_TYPE=Release
          -DMINIKV_BUILD_TESTS=ON
          -DMINIKV_BUILD_BENCHMARKS=ON

      - name: Verify tag and project version
        id: package
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build-release/CMakeCache.txt)"
          test -n "${project_version}"
          test "${tag_version}" = "${project_version}"
          echo "archive=minikv-${project_version}-linux-x86_64.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Build
        run: cmake --build build-release --parallel 2

      - name: Test
        run: ctest --test-dir build-release --output-on-failure

      - name: Package
        run: cpack --config build-release/CPackConfig.cmake -G TGZ -B dist

      - name: Test extracted package
        run: >-
          cmake
          -DMINIKV_SOURCE_DIR="${PWD}"
          -DMINIKV_BINARY_DIR="${PWD}/build-release"
          -DMINIKV_ARCHIVE="${PWD}/dist/${{ steps.package.outputs.archive }}"
          -DMINIKV_GENERATOR="Unix Makefiles"
          -P tests/package_smoke.cmake

      - name: Generate checksum
        working-directory: dist
        run: sha256sum "${{ steps.package.outputs.archive }}" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/${{ steps.package.outputs.archive }}" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --title "MiniKV ${GITHUB_REF_NAME}" \
            --notes $'First stable MiniKV release. The attached TGZ is a prebuilt Linux x86-64 C++ SDK; verify it with SHA256SUMS before use.\n\nMiniKV 首个稳定版本。附件 TGZ 是预编译的 Linux x86-64 C++ SDK，使用前请通过 SHA256SUMS 校验。'
